<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Onera Stock</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html5-qrcode Library for Barcode/QR Scanning -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg shadow-md shadow-indigo-600/30">
          <i data-lucide="boxes" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none text-white tracking-wide">Onera Stock</h1>
          <p class="text-xs text-slate-400 mt-0.5">Inventory Tracking System</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span id="nfcStatusBadge" class="hidden text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 border border-slate-600">
          NFC Scanner
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

    <!-- Success/Error Alert Toast -->
    <div id="alertToast" class="hidden p-4 rounded-xl shadow-lg border transition-all duration-300 flex items-start space-x-3">
      <i id="alertIcon" data-lucide="info" class="w-5 h-5 shrink-0 mt-0.5"></i>
      <div class="flex-1 text-sm font-medium" id="alertMessage"></div>
      <button onclick="hideAlert()" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Scanner Controls Block -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <i data-lucide="scan" class="w-4 h-4 text-indigo-400"></i> Scan Item / Tag
      </h2>

      <!-- Camera Scanner Viewfinder Container -->
      <div id="scannerContainer" class="hidden relative rounded-xl overflow-hidden bg-slate-950 border border-slate-700 mb-3 shadow-inner">
        <div id="reader" class="w-full"></div>
        <button id="stopScanBtn" onclick="stopCameraScanner()" class="absolute top-2 right-2 z-10 bg-rose-600/90 hover:bg-rose-600 text-white p-2 rounded-lg text-xs font-medium backdrop-blur flex items-center space-x-1 shadow">
          <i data-lucide="camera-off" class="w-4 h-4"></i>
          <span>Close Camera</span>
        </button>
      </div>

      <!-- Scan Action Buttons Grid -->
      <div class="grid grid-cols-2 gap-3">
        <button id="startScanBtn" onclick="startCameraScanner()" class="flex flex-col items-center justify-center p-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-xl font-medium transition shadow-lg shadow-indigo-600/25 border border-indigo-500/30">
          <i data-lucide="barcode" class="w-6 h-6 mb-1"></i>
          <span class="text-xs">Scan Barcode / QR</span>
        </button>

        <button id="nfcScanBtn" onclick="triggerNfcRead()" class="flex flex-col items-center justify-center p-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-xl font-medium transition shadow-lg shadow-emerald-600/25 border border-emerald-500/30">
          <i data-lucide="nfc" class="w-6 h-6 mb-1"></i>
          <span class="text-xs" id="nfcBtnText">Read NFC Tag</span>
        </button>
      </div>
    </div>

    <!-- Inventory Form Block -->
    <form id="inventoryForm" onsubmit="handleFormSubmit(event)" class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl space-y-4">

      <!-- Item Barcode / NFC ID Field -->
      <div>
        <label for="itemId" class="block text-xs font-medium text-slate-300 mb-1.5">Scanned Item ID / Tag Code <span class="text-indigo-400">*</span></label>
        <div class="relative">
          <input type="text" id="itemId" required placeholder="Scan barcode/NFC tag or enter manually" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          <button type="button" onclick="document.getElementById('itemId').value='';" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300">
            <i data-lucide="x-circle" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Storage Location Selector with Add Location Option -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="storageLocation" class="block text-xs font-medium text-slate-300">Storage Location <span class="text-indigo-400">*</span></label>
          <button type="button" onclick="promptAddLocation()" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Add Location
          </button>
        </div>
        <div class="relative">
          <select id="storageLocation" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 appearance-none transition pr-10">
            <option value="" disabled selected>-- Select Storage Location --</option>
