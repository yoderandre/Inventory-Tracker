<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Onera Stock</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html5-qrcode Library for Barcode/QR Scanning -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>

  <style>
    #reader video {
      object-fit: cover !important;
      border-radius: 0.75rem;
      width: 100% !important;
    }
    .pb-safe {
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 20px));
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-y-auto selection:bg-indigo-500 selection:text-white pb-28">

  <!-- Top Header with Integrated Page Toggle -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg shadow-md shadow-indigo-600/30">
          <i data-lucide="boxes" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none text-white tracking-wide">Onera Stock</h1>
          <p class="text-xs text-slate-400 mt-0.5">Inventory Tracking System</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span id="nfcStatusBadge" class="hidden text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 border border-slate-600">
          NFC Scanner
        </span>
      </div>
    </div>

    <!-- Top Tab Toggle Bar -->
    <div class="max-w-md mx-auto px-4 pb-2">
      <div class="grid grid-cols-2 bg-slate-900/80 p-1 rounded-xl border border-slate-700/80 text-xs font-semibold">
        <button id="topNavScanBtn" onclick="switchPage('scan')" class="py-2 rounded-lg text-center transition bg-indigo-600 text-white shadow">
          Scan Item
        </button>
        <button id="topNavInventoryBtn" onclick="switchPage('inventory')" class="py-2 rounded-lg text-center transition text-slate-400 hover:text-white">
          Item Locations
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

    <!-- Global Toast Alert -->
    <div id="alertToast" class="hidden p-4 rounded-xl shadow-lg border transition-all duration-300 flex items-start space-x-3">
      <i id="alertIcon" data-lucide="info" class="w-5 h-5 shrink-0 mt-0.5"></i>
      <div class="flex-1 text-sm font-medium" id="alertMessage"></div>
      <button onclick="hideAlert()" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- PAGE 1: SCAN & LOG FORM -->
    <div id="pageScan" class="space-y-4">
      <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl space-y-3">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i data-lucide="scan" class="w-4 h-4 text-indigo-400"></i> Scan Item / Tag
        </h2>

        <!-- Camera Viewfinder -->
        <div id="scannerContainer" class="hidden relative rounded-xl overflow-hidden bg-slate-950 border border-slate-700 mb-3 shadow-inner">
          <div id="reader" class="w-full min-h-[250px]"></div>
          <button id="stopScanBtn" onclick="stopCameraScanner()" class="absolute top-2 right-2 z-10 bg-rose-600/90 hover:bg-rose-600 text-white p-2 rounded-lg text-xs font-medium backdrop-blur flex items-center space-x-1 shadow">
            <i data-lucide="camera-off" class="w-4 h-4"></i>
            <span>Close Camera</span>
          </button>
        </div>

        <!-- Scan Buttons Grid -->
        <div class="grid grid-cols-2 gap-3">
          <button id="startScanBtn" type="button" onclick="startCameraScanner()" class="flex flex-col items-center justify-center p-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-xl font-medium transition shadow-lg shadow-indigo-600/25 border border-indigo-500/30">
            <i data-lucide="barcode" class="w-6 h-6 mb-1"></i>
            <span class="text-xs">Scan Barcode / QR</span>
          </button>

          <button id="nfcScanBtn" type="button" onclick="triggerNfcRead()" class="flex flex-col items-center justify-center p-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-xl font-medium transition shadow-lg shadow-emerald-600/25 border border-emerald-500/30">
            <i data-lucide="nfc" class="w-6 h-6 mb-1"></i>
            <span class="text-xs" id="nfcBtnText">Read NFC Tag</span>
          </button>
        </div>
      </div>

      <!-- Inventory Log Form -->
      <form id="inventoryForm" onsubmit="handleFormSubmit(event)" class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl space-y-4">
        <div>
          <label for="itemId" class="block text-xs font-medium text-slate-300 mb-1.5">Scanned Item ID / Tag Code <span class="text-indigo-400">*</span></label>
          <div class="relative">
            <input type="text" id="itemId" required placeholder="Scan barcode/NFC tag or enter manually" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            <button type="button" onclick="document.getElementById('itemId').value='';" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300">
              <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="storageLocation" class="block text-xs font-medium text-slate-300">Storage Location <span class="text-indigo-400">*</span></label>
            <button type="button" onclick="promptAddLocation()" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Add Location
            </button>
          </div>
          <div class="relative">
            <select id="storageLocation" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 appearance-none transition pr-10">
              <option value="" disabled selected>-- Select Storage Location --</option>
              <option value="Warehouse building 3">Warehouse building 3</option>
              <option value="Warehouse Building 7">Warehouse Building 7</option>
              <option value="Maintenance Building 1">Maintenance Building 1</option>
              <option value="Dacor Building 2">Dacor Building 2</option>
              <option value="Dacor Building 4">Dacor Building 4</option>
              <option value="DM Cores">DM Cores</option>
              <option value="EM Cores">EM Cores</option>
              <option value="Windy ridge">Windy ridge</option>
            </select>
            <div class="absolute right-3 top-3 pointer-events-none text-slate-400">
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </div>
          </div>
        </div>

        <div>
          <label for="operator" class="block text-xs font-medium text-slate-300 mb-1.5">Operator Name / ID <span class="text-indigo-400">*</span></label>
          <input type="text" id="operator" required placeholder="Enter operator name or ID" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white py-3 px-4 rounded-xl font-semibold text-sm transition shadow-lg shadow-indigo-600/25 flex items-center justify-center space-x-2 border border-indigo-500/30 disabled:opacity-50">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>Save to Google Sheet</span>
        </button>
      </form>
    </div>

    <!-- PAGE 2: INVENTORY LOOKUP -->
    <div id="pageInventory" class="hidden space-y-4">
      <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400"></i> Latest Item Locations
          </h2>
          <button onclick="fetchLatestInventory()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <!-- Search Input -->
        <div class="relative">
          <input type="text" id="inventorySearch" oninput="filterInventoryList()" placeholder="Search item ID, location, or operator..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-2.5"></i>
        </div>
      </div>

      <!-- Inventory List Cards -->
      <div id="inventoryList" class="space-y-3">
        <div class="text-center py-8 text-slate-500 text-sm">
          Loading latest inventory locations from Google Sheets...
        </div>
      </div>
    </div>

  </main>

  <!-- Sticky Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700/80 z-50 pb-safe">
    <div class="max-w-md mx-auto grid grid-cols-2">
      <button id="navScanBtn" onclick="switchPage('scan')" class="flex flex-col items-center justify-center py-2.5 text-indigo-400 font-medium">
        <i data-lucide="scan-line" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px]">Scan Item</span>
      </button>
      <button id="navInventoryBtn" onclick="switchPage('inventory')" class="flex flex-col items-center justify-center py-2.5 text-slate-400 font-medium hover:text-slate-200">
        <i data-lucide="boxes" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px]">Item Locations</span>
      </button>
    </div>
  </nav>

  <!-- JavaScript Logic -->
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3J_UTxuGUETX1_b8MLp3Vd99gRp2gT9KJkhp_8ziAp8KPRV6FAk3ESxs_a2eQ9ShAKA/exec";

    let html5QrCode = null;
    let nfcReader = null;
    let latestInventoryMap = new Map();

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      checkNfcSupport();
      loadCustomLocations();
    });

    function switchPage(page) {
      const pageScan = document.getElementById('pageScan');
      const pageInventory = document.getElementById('pageInventory');

      const topScan = document.getElementById('topNavScanBtn');
      const topInv = document.getElementById('topNavInventoryBtn');

      const bottomScan = document.getElementById('navScanBtn');
      const bottomInv = document.getElementById('navInventoryBtn');

      if (page === 'scan') {
        pageScan.classList.remove('hidden');
        pageInventory.classList.add('hidden');

        topScan.className = "py-2 rounded-lg text-center transition bg-indigo-600 text-white shadow";
        topInv.className = "py-2 rounded-lg text-center transition text-slate-400 hover:text-white";

        bottomScan.className = "flex flex-col items-center justify-center py-2.5 text-indigo-400 font-medium";
        bottomInv.className = "flex flex-col items-center justify-center py-2.5 text-slate-400 font-medium hover:text-slate-200";
      } else {
        pageScan.classList.add('hidden');
        pageInventory.classList.remove('hidden');

        topScan.className = "py-2 rounded-lg text-center transition text-slate-400 hover:text-white";
        topInv.className = "py-2 rounded-lg text-center transition bg-emerald-600 text-white shadow";

        bottomScan.className = "flex flex-col items-center justify-center py-2.5 text-slate-400 font-medium hover:text-slate-200";
        bottomInv.className = "flex flex-col items-center justify-center py-2.5 text-emerald-400 font-medium";

        stopCameraScanner();
        fetchLatestInventory();
      }
      lucide.createIcons();
    }

    async function startCameraScanner() {
      const container = document.getElementById("scannerContainer");
      container.classList.remove("hidden");

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader", {
          verbose: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODABAR,
            Html5QrcodeSupportedFormats.ITF
          ]
        });
      }

      const config = {
        fps: 15,
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          const width = Math.floor(viewfinderWidth * 0.85);
          const height = Math.floor(viewfinderHeight * 0.45);
          return { width: width, height: Math.max(height, 120) };
        },
        videoConstraints: {
          facingMode: { exact: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            document.getElementById("itemId").value = decodedText;
            showAlert("Barcode Scanned", `Captured ID: <strong>${decodedText}</strong>`, "success");
            stopCameraScanner();
          },
          () => {}
        );
      } catch (err) {
        try {
          await html5QrCode.start({ facingMode: "user" }, config, (decodedText) => {
            document.getElementById("itemId").value = decodedText;
            showAlert("Barcode Scanned", `Captured ID: <strong>${decodedText}</strong>`, "success");
            stopCameraScanner();
          }, () => {});
        } catch (fallbackErr) {
          showAlert("Camera Error", "Could not access camera. Ensure camera permissions are allowed.", "error");
          container.classList.add("hidden");
        }
      }
    }

    async function stopCameraScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      document.getElementById("scannerContainer").classList.add("hidden");
    }

    async function fetchLatestInventory() {
      const container = document.getElementById('inventoryList');
      container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm flex items-center justify-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Fetching from Google Sheets...</div>`;
      lucide.createIcons();

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "GET",
          redirect: "follow"
        });

        const result = await response.json();

        if (result.status === "success" && result.data) {
          latestInventoryMap.clear();

          result.data.forEach(row => {
            latestInventoryMap.set(String(row.itemId), {
              itemId: row.itemId,
              location: row.location,
              operator: row.operator,
              timestamp: row.timestamp
            });
          });

          renderInventoryList(Array.from(latestInventoryMap.values()));
        } else {
          container.innerHTML = `<div class="text-center py-8 text-rose-400 text-sm">Failed to load inventory records.</div>`;
        }
      } catch (error) {
        console.error("Fetch Error:", error);
        container.innerHTML = `<div class="text-center py-8 text-rose-400 text-sm">Error connecting to Google Sheets. Check console for details.</div>`;
      }
    }

    function renderInventoryList(items) {
      const container = document.getElementById('inventoryList');

      if (items.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">No items logged yet.</div>`;
        return;
      }

      container.innerHTML = items.reverse().map(item => `
        <div class="bg-slate-800 border border-slate-700/80 rounded-xl p-3.5 shadow-md flex flex-col space-y-2">
          <div class="flex items-center justify-between">
            <span class="font-bold text-sm text-indigo-300 font-mono">ID: ${item.itemId}</span>
            <span class="text-[10px] text-slate-400 px-2 py-0.5 rounded bg-slate-900 border border-slate-700">${formatDate(item.timestamp)}</span>
          </div>
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center text-emerald-400 font-medium gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
              <span>${item.location}</span>
            </div>
            <div class="text-slate-400 flex items-center gap-1">
              <i data-lucide="user" class="w-3 h-3"></i>
              <span>${item.operator}</span>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function filterInventoryList() {
      const query = document.getElementById('inventorySearch').value.toLowerCase();
      const allItems = Array.from(latestInventoryMap.values());
      const filtered = allItems.filter(i => 
        String(i.itemId).toLowerCase().includes(query) ||
        String(i.location).toLowerCase().includes(query) ||
        String(i.operator).toLowerCase().includes(query)
      );
      renderInventoryList(filtered);
    }

    function formatDate(dateStr) {
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return dateStr;
      }
    }

    function loadCustomLocations() {
      const savedLocations = JSON.parse(localStorage.getItem('onera_custom_locations') || '[]');
      const selectElem = document.getElementById('
